<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saung Hibar - Supplier</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap");
      :root {
        --green: #2c5e31;
        --green-dark: #234b27;
        --green-soft: #eef4e9;
        --cream: #fcfaf6;
        --text: #242824;
        --muted: #777f76;
        --line: #e5e8e1;
        --gold: #d4a373;
        --red: #b54747;
        --shadow: 0 2px 8px rgba(25, 35, 20, 0.07);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Poppins, Arial, sans-serif;
      }
      body {
        background: #fff;
        color: var(--text);
        min-height: 100vh;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a {
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .app-shell {
        max-width: 590px;
        min-height: 100vh;
        margin: 0 auto;
        background: var(--cream);
        box-shadow: 0 0 18px #00000008;
      }
      .topbar {
        height: 76px;
        padding: 0 26px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #eee;
        position: sticky;
        top: 0;
        z-index: 20;
      }
      .brand img {
        display: block;
        width: 150px;
        max-height: 52px;
        object-fit: contain;
      }
      .top-actions {
        display: flex;
        gap: 15px;
        align-items: center;
      }
      .icon-btn {
        border: 0;
        background: transparent;
        color: var(--green);
        font-size: 19px;
        padding: 5px;
      }
      .menu-panel {
        display: none;
        position: absolute;
        right: 18px;
        top: 66px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        min-width: 205px;
        padding: 8px;
      }
      .menu-panel.open {
        display: block;
      }
      .menu-panel a {
        display: block;
        padding: 11px;
        border-radius: 8px;
        font-size: 13px;
      }
      .menu-panel a:hover {
        background: var(--green-soft);
        color: var(--green);
      }
      main {
        padding: 30px 28px 45px;
      }
      .page-heading {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 25px;
      }
      .back-btn {
        width: 28px;
        height: 34px;
        border: 0;
        background: transparent;
        color: var(--green);
        font-size: 19px;
      }
      .page-heading h1 {
        font-size: 25px;
        line-height: 1.3;
        font-weight: 700;
      }
      .page-heading p {
        font-size: 12px;
        color: #858980;
        margin-top: 4px;
      }
      .search-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: #fff;
        padding: 0 15px;
        height: 42px;
        flex: 1;
        min-width: 0;
      }
      .search-wrap i {
        color: var(--green);
        font-size: 14px;
      }
      .search-wrap input {
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        font-size: 12px;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 14px 0 23px;
        flex-wrap: wrap;
      }
      .btn,
      .filter-chip {
        border: 1px solid var(--line);
        border-radius: 22px;
        background: #fff;
        padding: 10px 16px;
        font-size: 12px;
        color: var(--text);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn.primary,
      .filter-chip.active {
        background: var(--green);
        border-color: var(--green);
        color: #fff;
      }
      .btn:hover {
        filter: brightness(0.97);
      }
      .btn.danger {
        color: var(--red);
        border-color: #e9caca;
      }
      .filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 14px 0 22px;
      }
      .section-heading {
        margin-bottom: 14px;
      }
      .section-heading h2 {
        font-size: 17px;
      }
      .section-heading p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 3px;
      }
      .record-list {
        display: flex;
        flex-direction: column;
        gap: 13px;
      }
      .record-card {
        background: #fff;
        border: 1px solid #e9e9e5;
        border-radius: 18px;
        padding: 18px 19px;
        box-shadow: var(--shadow);
      }
      .record-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 10px;
      }
      .record-title {
        font-size: 17px;
        font-weight: 700;
      }
      .record-sub {
        font-size: 11px;
        color: var(--muted);
        margin-top: 3px;
      }
      .record-info {
        display: grid;
        gap: 7px;
        font-size: 12px;
        color: #666;
      }
      .record-info span {
        display: flex;
        gap: 9px;
        align-items: flex-start;
      }
      .record-info i {
        width: 15px;
        color: #7c9975;
        margin-top: 3px;
      }
      .record-footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid;
        border-radius: 18px;
        padding: 4px 11px;
        font-size: 11px;
        white-space: nowrap;
      }
      .status.baru,
      .status.menipis,
      .status.menunggu {
        color: #9b713c;
        background: #fff8e7;
        border-color: #e1c99e;
      }
      .status.diproses {
        color: #506e87;
        background: #edf5fb;
        border-color: #9eb5c8;
      }
      .status.diantar,
      .status.dipesan {
        color: #a67550;
        background: #fff4eb;
        border-color: #d7b69a;
      }
      .status.selesai,
      .status.cukup,
      .status.diterima {
        color: #55784b;
        background: #f2fae9;
        border-color: #a6c58e;
      }
      .status.habis,
      .status.ditolak {
        color: #a34747;
        background: #fff0ef;
        border-color: #e4b6b2;
      }
      .empty-state {
        background: #fff;
        border: 1px dashed #cfd8ca;
        border-radius: 15px;
        padding: 30px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }
      .notice {
        display: none;
        position: fixed;
        top: 88px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        background: #244b27;
        color: #fff;
        border-radius: 10px;
        padding: 12px 16px;
        width: min(88%, 390px);
        font-size: 12px;
        box-shadow: var(--shadow);
      }
      .notice.show {
        display: block;
      }
      .modal-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: #14191477;
        z-index: 80;
        padding: 18px;
        align-items: center;
        justify-content: center;
      }
      .modal-backdrop.open {
        display: flex;
      }
      .modal {
        width: min(100%, 440px);
        max-height: 90vh;
        overflow: auto;
        background: #fff;
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 10px 40px #0003;
      }
      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .modal-head h2 {
        font-size: 18px;
      }
      .modal-close {
        border: 0;
        background: transparent;
        font-size: 25px;
        color: #777;
      }
      .modal p {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.6;
        margin-bottom: 12px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 10px 0;
      }
      .field.full {
        grid-column: 1/-1;
      }
      .field label {
        font-size: 12px;
        font-weight: 600;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        border: 1px solid #dfe4dc;
        border-radius: 9px;
        padding: 10px 11px;
        font-size: 12px;
        outline-color: #77996e;
        background: #fff;
      }
      .field textarea {
        resize: vertical;
        min-height: 75px;
      }
      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 15px;
      }
      .detail-panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
        box-shadow: var(--shadow);
        margin-bottom: 15px;
      }
      .detail-panel h2 {
        font-size: 16px;
        margin-bottom: 15px;
      }
      .detail-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .detail-item small {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-bottom: 4px;
      }
      .detail-item strong {
        font-size: 13px;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .table-wrap {
        overflow-x: auto;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
      }
      .data-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 460px;
        font-size: 12px;
      }
      .data-table th {
        background: #e7ebe2;
        color: #526d47;
        text-align: left;
        padding: 13px 12px;
        font-weight: 600;
      }
      .data-table td {
        padding: 13px 12px;
        border-top: 1px solid #edf0eb;
      }
      .low-stock {
        color: #a36c31;
      }
      .stock-icon {
        width: 48px;
        height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: #edf1e9;
        color: var(--green);
        font-size: 20px;
      }
      .muted {
        color: var(--muted);
      }
      @media (max-width: 430px) {
        .topbar {
          padding: 0 18px;
          height: 68px;
        }
        .brand img {
          width: 130px;
        }
        main {
          padding: 25px 18px 35px;
        }
        .page-heading h1 {
          font-size: 23px;
        }
        .record-card {
          padding: 16px;
        }
        .form-grid,
        .detail-grid {
          grid-template-columns: 1fr;
        }
        .field.full {
          grid-column: auto;
        }
        .toolbar .search-wrap {
          flex-basis: 100%;
        }
        .record-title {
          font-size: 15px;
        }
      }

      /* Responsive enhancements — Tim 3, additive overrides to preserve the existing visual identity. */
      html {
        width: 100%;
        min-width: 0;
        scrollbar-gutter: stable;
      }
      body {
        width: 100%;
        overflow-x: hidden;
      }
      .app-shell {
        width: 100%;
        max-width: 1180px;
        min-width: 0;
      }
      .topbar {
        width: 100%;
        gap: 12px;
      }
      .top-actions {
        flex-shrink: 0;
      }
      .brand {
        min-width: 0;
      }
      .brand img {
        max-width: 100%;
        height: auto;
      }
      main {
        width: 100%;
        min-width: 0;
      }
      .toolbar > * {
        min-width: 0;
      }
      .search-wrap {
        max-width: 100%;
      }
      .record-list,
      .record-card,
      .detail-panel,
      .section-heading,
      .page-heading {
        min-width: 0;
        max-width: 100%;
      }
      .record-info span {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .table-wrap {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        overscroll-behavior-x: contain;
        -webkit-overflow-scrolling: touch;
      }
      .data-table {
        width: 100%;
        min-width: 560px;
      }
      .modal-backdrop {
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .modal {
        min-width: 0;
        width: min(100%, 520px);
        max-height: calc(100dvh - 36px);
        overscroll-behavior: contain;
      }
      .form-grid > * {
        min-width: 0;
      }
      .field input,
      .field select,
      .field textarea {
        min-width: 0;
        max-width: 100%;
      }
      .btn,
      .filter-chip,
      .icon-btn,
      .modal-close {
        min-height: 40px;
      }
      .menu-panel {
        z-index: 40;
        max-width: calc(100vw - 24px);
        max-height: calc(100dvh - 90px);
        overflow-y: auto;
      }
      @media (min-width: 769px) {
        .app-shell {
          max-width: 1180px;
        }
        .topbar {
          padding-inline: clamp(24px, 4vw, 48px);
        }
        main {
          padding: clamp(28px, 3vw, 44px) clamp(24px, 4vw, 48px) 48px;
        }
        .page-heading h1 {
          font-size: clamp(25px, 2vw, 30px);
        }
        .toolbar {
          align-items: center;
        }
        .toolbar .search-wrap {
          flex: 1 1 260px;
        }
        .record-list {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          align-items: stretch;
        }
        .record-card {
          height: 100%;
        }
        .detail-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .form-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .modal {
          width: min(100%, 560px);
        }
      }
      @media (min-width: 1281px) {
        .app-shell {
          max-width: 1360px;
        }
        main {
          padding-inline: clamp(48px, 5vw, 76px);
        }
        .record-list {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .data-table {
          min-width: 0;
        }
      }
      @media (max-width: 768px) {
        .app-shell {
          max-width: 100%;
          box-shadow: none;
        }
        .topbar {
          height: 68px;
          padding: 0 18px;
        }
        .brand img {
          width: clamp(112px, 34vw, 145px);
          max-height: 46px;
          object-fit: contain;
        }
        .top-actions {
          gap: 8px;
        }
        .icon-btn {
          font-size: 18px;
          padding: 8px;
          min-width: 38px;
          min-height: 40px;
        }
        main {
          padding: 24px clamp(16px, 4vw, 26px) 36px;
        }
        .page-heading {
          gap: 10px;
          margin-bottom: 20px;
        }
        .page-heading h1 {
          font-size: clamp(21px, 4vw, 25px);
          overflow-wrap: anywhere;
        }
        .toolbar {
          gap: 8px;
        }
        .toolbar .search-wrap {
          flex: 1 1 100%;
          order: -1;
        }
        .btn,
        .filter-chip {
          padding: 10px 13px;
          min-height: 42px;
        }
        .record-list {
          display: flex;
        }
        .record-card {
          padding: 16px;
        }
        .data-table {
          min-width: 560px;
        }
        .detail-panel {
          padding: 17px;
        }
        .modal-backdrop {
          padding: 12px;
        }
        .modal {
          max-height: calc(100dvh - 24px);
          padding: 18px;
        }
        .menu-panel {
          right: 12px;
          top: 60px;
        }
      }
      @media (max-width: 480px) {
        .topbar {
          padding-inline: 12px;
        }
        .brand img {
          width: 112px;
        }
        .top-actions {
          gap: 3px;
        }
        .icon-btn {
          padding: 6px;
          min-width: 36px;
        }
        .top-actions .icon-btn {
          font-size: 17px;
        }
        main {
          padding: 20px 14px 30px;
        }
        .page-heading {
          align-items: flex-start;
          gap: 8px;
        }
        .page-heading h1 {
          font-size: 21px;
        }
        .page-heading p {
          font-size: 11px;
        }
        .record-card {
          border-radius: 14px;
          padding: 14px;
        }
        .record-top {
          flex-wrap: wrap;
        }
        .record-title {
          font-size: 15px;
          overflow-wrap: anywhere;
        }
        .record-info {
          font-size: 12px;
        }
        .record-footer {
          justify-content: stretch;
        }
        .record-footer .btn {
          flex: 1 1 auto;
        }
        .toolbar > .btn {
          flex: 1 1 auto;
        }
        .filters {
          gap: 6px;
        }
        .filter-chip {
          font-size: 11px;
          padding: 9px 11px;
        }
        .form-grid,
        .detail-grid {
          grid-template-columns: minmax(0, 1fr);
          gap: 8px;
        }
        .field.full {
          grid-column: auto;
        }
        .field input,
        .field select,
        .field textarea {
          font-size: 16px;
          padding: 11px;
        }
        .form-actions {
          flex-wrap: wrap;
        }
        .form-actions .btn {
          flex: 1 1 120px;
        }
        .detail-panel {
          padding: 15px;
        }
        .detail-item strong {
          font-size: 13px;
        }
        .modal {
          border-radius: 14px;
          padding: 16px;
        }
        .modal-head h2 {
          font-size: 16px;
        }
        .data-table {
          min-width: 540px;
        }
        .empty-state {
          padding: 22px 14px;
        }
      }
      @media (max-width: 360px) {
        .topbar {
          padding-inline: 9px;
        }
        .brand img {
          width: 100px;
        }
        .top-actions {
          gap: 0;
        }
        .icon-btn {
          min-width: 32px;
          padding: 5px;
        }
        main {
          padding-inline: 11px;
        }
        .page-heading h1 {
          font-size: 19px;
        }
        .btn,
        .filter-chip {
          padding-inline: 10px;
          font-size: 11px;
        }
        .record-footer {
          gap: 6px;
        }
        .record-footer .btn {
          padding-inline: 9px;
        }
      }
      @media (orientation: landscape) and (max-height: 500px) {
        .topbar {
          height: 58px;
        }
        .menu-panel {
          top: 52px;
        }
        .modal-backdrop {
          align-items: flex-start;
        }
        .modal {
          max-height: calc(100dvh - 24px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Individual HTML responsive safety patch */
      html {
        max-width: 100%;
        overflow-x: clip;
      }
      body {
        width: 100%;
        overflow-x: clip;
      }
      img,
      svg,
      video,
      canvas {
        max-width: 100%;
        height: auto;
      }
      .app-shell {
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }
      main {
        min-width: 0;
      }
      .table-wrap {
        max-width: 100%;
        overscroll-behavior-x: contain;
      }
      input,
      select,
      textarea,
      button {
        max-width: 100%;
        min-height: 40px;
      }
      .menu-panel {
        max-width: calc(100vw - 24px);
        max-height: calc(100dvh - 90px);
        overflow: auto;
      }
      .modal-backdrop {
        overflow-y: auto;
      }
      .modal {
        max-height: calc(100dvh - 36px);
        overscroll-behavior: contain;
      }
      @media (min-width: 769px) {
        .app-shell {
          max-width: 760px;
        }
      }
      @media (min-width: 1281px) {
        .app-shell {
          max-width: 900px;
        }
      }
      @media (max-width: 480px) {
        main {
          padding-left: 16px;
          padding-right: 16px;
        }
        .topbar {
          padding-left: 16px;
          padding-right: 16px;
        }
        .toolbar {
          align-items: stretch;
        }
        .toolbar > .btn,
        .toolbar > select {
          flex: 1 1 auto;
        }
        .form-actions > .btn {
          flex: 1;
        }
        .record-footer {
          justify-content: stretch;
        }
        .record-footer > .btn {
          flex: 1;
        }
      }
    </style>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body data-page="suppliers">
    <div class="app-shell">
      <header class="topbar">
        <a
          class="brand"
          href="../Dashboard/dashboard.html"

        function read(key) {
          const seedKey = Object.keys(KEYS).find((k) => KEYS[k] === key),
            fallback = seed[seedKey] || [];
          try {
            const raw = localStorage.getItem(key);
            if (raw !== null) {
              const parsed = JSON.parse(raw);
              if (Array.isArray(parsed)) return parsed;
              console.error(
                "Format data tersimpan tidak sesuai; data lama tidak ditimpa:",
                key,
              );
              return [...fallback];
            }
            localStorage.setItem(key, JSON.stringify(fallback));
            return [...fallback];
          } catch (e) {
            // Jangan menimpa key yang sudah ada tetapi rusak/tidak dapat dibaca.
            console.error(
              "Gagal membaca penyimpanan; data lama dipertahankan:",
              key,
              e,
            );
            return [...fallback];
          }

            modalBase(existing ? "Edit Supplier" : "Tambah Supplier", body),
          );
          bindModal();
          $("#supplierForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const f = new FormData(e.target),
              v = {
                name: String(f.get("name")).trim(),
                contact: String(f.get("contact")).trim(),
                email: String(f.get("email")).trim(),
                category: String(f.get("category")),
                address: String(f.get("address")).trim(),
              };
            if (existing) Object.assign(existing, v);
            else
              data.suppliers.unshift({
                id: "SUP-" + String(Date.now()).slice(-7),
                ...v,
              });
            save("suppliers", data.suppliers);
            modal(false);
            $("#recordModal").remove();
            renderSuppliers();
            notice("Data supplier berhasil disimpan.");
          });
        }
        function renderProcurements() {
          const root = $("#procurementList");
          if (!root) return;
          const q = ($("#searchInput")?.value || "").toLowerCase().trim(),
            st = $("#statusFilter")?.value || "semua";
          const list = data.procurements.filter((p) => {
            const s = data.stocks.find((x) => x.id === p.itemId),
              v = data.suppliers.find((x) => x.id === p.supplierId);
            return (
              (st === "semua" || p.status === st) &&
              `${p.id} ${s?.name || ""} ${v?.name || ""} ${p.date}`
                .toLowerCase()
                .includes(q)
            );
          });
          $("#procurementCount").textContent = `${list.length} data pengadaan`;
          root.innerHTML =
            list
              .map((p) => {
                const s = data.stocks.find((x) => x.id === p.itemId),
                  v = data.suppliers.find((x) => x.id === p.supplierId);
                return `<article class="record-card"><div class="record-top"><div><h3 class="record-title">${esc(p.id)}</h3><p class="record-sub">${datefmt(p.date)}</p></div>${pill(p.status)}</div><div class="record-info"><span><i class="fa-solid fa-box"></i>Barang: ${esc(s?.name || "Barang tidak tersedia")}</span><span><i class="fa-solid fa-truck-field"></i>Supplier: ${esc(v?.name || "Supplier tidak tersedia")}</span><span><i class="fa-solid fa-cubes-stacked"></i>Jumlah: ${p.qty} ${esc(s?.unit || "unit")}</span><span><i class="fa-regular fa-note-sticky"></i>Catatan: ${esc(p.note || "—")}</span></div><div class="record-footer"><button class="btn" data-edit-po="${esc(p.id)}"><i class="fa-solid fa-pen"></i> Ubah Status</button></div></article>`;
              })
              .join("") ||
            `<div class="empty-state">Data pengadaan tidak ditemukan.</div>`;
        }
        function procurementForm(existing) {
          const p = existing || {
            itemId: data.stocks[0]?.id || "",
            supplierId: data.suppliers[0]?.id || "",
            qty: 1,
            date: today(),
            status: "Menunggu",
            note: "",
          };
          const body = `<form id="procurementForm"><div class="form-grid"><div class="field full"><label>Barang *</label><select name="itemId" required>${data.stocks.map((s) => `<option value="${esc(s.id)}" ${s.id === p.itemId ? "selected" : ""}>${esc(s.name)} (${esc(s.unit)})</option>`).join("")}</select></div><div class="field full"><label>Supplier *</label><select name="supplierId" required>${data.suppliers.map((s) => `<option value="${esc(s.id)}" ${s.id === p.supplierId ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></div><div class="field"><label>Jumlah *</label><input name="qty" type="number" min="1" step="any" required value="${p.qty}"></div><div class="field"><label>Tanggal *</label><input name="date" type="date" required value="${esc(p.date)}"></div><div class="field"><label>Status</label><select name="status">${["Menunggu", "Dipesan", "Diterima", "Ditolak"].map((s) => `<option ${s === p.status ? "selected" : ""}>${s}</option>`).join("")}</select></div><div class="field"><label>Catatan</label><input name="note" maxlength="150" value="${esc(p.note)}"></div></div><p class="muted">Stok bertambah otomatis satu kali ketika status diubah menjadi Diterima.</p><div class="form-actions"><button type="button" class="btn" data-close>Batal</button><button class="btn primary">Simpan Pengadaan</button></div></form>`;
          document.body.insertAdjacentHTML(
            "beforeend",
            modalBase(existing ? "Ubah Pengadaan" : "Tambah Pengadaan", body),
          );
          bindModal();
          $("#procurementForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const f = new FormData(e.target),
              qty = Number(f.get("qty")),
              status = String(f.get("status"));
            if (!Number.isFinite(qty) || qty <= 0) {
              notice("Jumlah pengadaan harus lebih dari nol.");
              return;
            }
            const v = {
              itemId: String(f.get("itemId")),
              supplierId: String(f.get("supplierId")),
              qty,
              date: String(f.get("date")),
              status,
              note: String(f.get("note")).trim(),
            };
            if (existing) {
              const wasReceived = existing.status === "Diterima";
              if (
                wasReceived &&
                (status !== "Diterima" ||
                  v.itemId !== existing.itemId ||
                  v.qty !== Number(existing.qty) ||
                  v.supplierId !== existing.supplierId ||
                  v.date !== existing.date)
              ) {
                notice(
                  "Pengadaan yang sudah diterima dikunci agar riwayat dan stok tetap konsisten.",
                );
                return;
              }
              Object.assign(existing, v);
              if (
                !wasReceived &&
                status === "Diterima" &&
                !existing.receivedApplied
              ) {
                applyProcurementStock(existing);
                existing.receivedApplied = true;
              }
            } else {
              const po = {
                id: "PO-" + String(Date.now()).slice(-7),
                ...v,
                receivedApplied: false,
              };
              if (status === "Diterima") {
                applyProcurementStock(po);
                po.receivedApplied = true;
              }
              data.procurements.unshift(po);
            }
            save("procurements", data.procurements);
            save("stocks", data.stocks);
            modal(false);
            $("#recordModal").remove();
            renderProcurements();
            notice("Data pengadaan berhasil disimpan.");
          });
        }
        function applyProcurementStock(p) {
          const s = data.stocks.find((x) => x.id === p.itemId);
          if (s) {
            s.qty = Number(s.qty) + Number(p.qty);
            s.updated = today();
          }
        }
        function init() {
          setupHeader();
          const page = document.body.dataset.page;
          if (page === "orders") {
            renderOrders();
            $("#searchInput").addEventListener("input", renderOrders);
            $("#statusFilter").addEventListener("change", renderOrders);
            $("#newOrderBtn").addEventListener("click", orderForm);
          }
          if (page === "order-detail") renderOrderDetail();
          if (page === "stocks") {
            renderStocks();
            $("#searchInput").addEventListener("input", renderStocks);
            $("#categoryFilter").addEventListener("change", renderStocks);
            $("#addStockBtn").addEventListener("click", () => stockForm());
          }
          if (page === "stock-detail") renderStockDetail();
          if (page === "suppliers") {
            renderSuppliers();
            $("#searchInput").addEventListener("input", renderSuppliers);
            $("#addSupplierBtn").addEventListener("click", () =>
              supplierForm(),
            );
          }
          if (page === "procurements") {
            renderProcurements();
            $("#searchInput").addEventListener("input", renderProcurements);
            $("#statusFilter").addEventListener("change", renderProcurements);
            $("#addProcurementBtn").addEventListener("click", () => {
              if (!data.stocks.length || !data.suppliers.length) {
                notice("Tambahkan barang dan supplier terlebih dahulu.");
                return;
              }
              procurementForm();
            });
          }
          document.addEventListener("click", (e) => {
            const d = e.target.closest("[data-delete-stock]");
            if (d) {
              const id = d.dataset.deleteStock;
              if (
                data.procurements.some(
                  (p) => p.itemId === id && p.status !== "Ditolak",
                )
              ) {
                notice(
                  "Barang terkait pengadaan. Hapus atau selesaikan pengadaan terkait terlebih dahulu.",
                );
                return;
              }
              if (confirm("Hapus barang ini?")) {
                data.stocks = data.stocks.filter((s) => s.id !== id);
                save("stocks", data.stocks);
                renderStocks();
                notice("Barang dihapus.");
              }
            }
            const es = e.target.closest("[data-edit-supplier]");
            if (es)
              supplierForm(
                data.suppliers.find((s) => s.id === es.dataset.editSupplier),
              );
            const ds = e.target.closest("[data-delete-supplier]");
            if (ds) {
              const id = ds.dataset.deleteSupplier;
              if (
                data.procurements.some(
                  (p) => p.supplierId === id && p.status !== "Ditolak",
                )
              ) {
                notice("Supplier masih terhubung dengan pengadaan aktif.");
                return;
              }
              if (confirm("Hapus supplier ini?")) {
                data.suppliers = data.suppliers.filter((s) => s.id !== id);
                save("suppliers", data.suppliers);
                renderSuppliers();
                notice("Supplier dihapus.");
              }
            }
            const ep = e.target.closest("[data-edit-po]");
            if (ep)
              procurementForm(
                data.procurements.find((p) => p.id === ep.dataset.editPo),
              );
          });
        }
        document.addEventListener("DOMContentLoaded", init);
      })();
    </script>
  </body>
</html>
