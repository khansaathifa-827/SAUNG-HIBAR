<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="kalender-ketersediaan.css" />
    <title>Filter Kalender - Saung Hibar</title>
  </head>

  <body>
    <main class="filter-panel" id="filterPanel">
      <header class="filter-header">
        <h1>Filter</h1>
        <button
          type="button"
          class="close-button"
          id="closeButton"
          aria-label="Tutup filter"
        >
          &times;
        </button>
      </header>

      <form id="filterForm">
        <!-- Status booking -->
        <section class="filter-group">
          <span class="group-title">Status Booking</span>

          <div class="status-grid" id="statusGrid">
            <button
              type="button"
              class="status-option active"
              data-status="Semua"
              aria-pressed="true"
            >
              Semua
            </button>

            <button
              type="button"
              class="status-option"
              data-status="Pending"
              aria-pressed="false"
            >
              Pending
            </button>

            <button
              type="button"
              class="status-option"
              data-status="Check-in"
              aria-pressed="false"
            >
              Check-in
            </button>

            <button
              type="button"
              class="status-option"
              data-status="Check-out"
              aria-pressed="false"
            >
              Check-out
            </button>

            <button
              type="button"
              class="status-option"
              data-status="Selesai"
              aria-pressed="false"
            >
              Selesai
            </button>

            <button
              type="button"
              class="status-option"
              data-status="Dibatalkan"
              aria-pressed="false"
            >
              Dibatalkan
            </button>
          </div>
        </section>

        <!-- Tanggal kunjungan -->
        <section class="filter-group">
          <label class="group-title" for="tanggalMulai">
            Tanggal Kunjungan
          </label>

          <div class="field-control date-range">
            <span class="calendar-icon" aria-hidden="true">▦</span>

            <button
              type="button"
              id="pilihRentangTanggal"
              class="date-range-button"
              aria-expanded="false"
            >
              <span id="teksTanggal">Pilih tanggal kunjungan</span>
              <svg
                class="arrow-svg"
                width="19"
                height="19"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M6 9l6 6 6-6" />
              </svg>
            </button>

            <div class="date-picker-popup" id="datePickerPopup" hidden>
              <label for="tanggalMulai">Check-in</label>
              <input type="date" id="tanggalMulai" value="2026-10-09" />

              <label for="tanggalSelesai">Check-out</label>
              <input type="date" id="tanggalSelesai" value="2026-10-12" />

              <button type="button" id="selesaiPilihTanggal">Selesai</button>
            </div>
          </div>
        </section>

        <!-- Area -->
        <section class="filter-group">
          <label class="group-title" for="area">Area</label>

          <div class="field-control">
            <select id="area">
              <option value="">Semua Area</option>
              <option value="Area A">Area A</option>
              <option value="Area B">Area B</option>
              <option value="Area C">Area C</option>
            </select>
          </div>
        </section>

        <!-- Blok -->
        <section class="filter-group">
          <label class="group-title" for="blok">Blok</label>

          <div class="field-control">
            <select id="blok">
              <option value="">Semua Blok</option>
              <option value="Blok A1">Blok A1</option>
              <option value="Blok A2">Blok A2</option>
              <option value="Blok B1">Blok B1</option>
              <option value="Blok B2">Blok B2</option>
            </select>
          </div>
        </section>

        <!-- Tombol -->
        <div class="actions">
          <button type="submit" class="btn btn-apply">Terapkan Filter</button>

          <button type="button" class="btn btn-reset" id="resetButton">
            Reset
          </button>
        </div>

        <div
          class="message"
          id="filterMessage"
          role="status"
          aria-live="polite"
        ></div>
      </form>
    </main>

    <button type="button" class="reopen-button" id="reopenButton">
      Buka Filter
    </button>
    <section class="booking-section">
      <div class="booking-heading">
        <h2>Hasil Booking</h2>
        <span id="jumlahBooking">0 booking</span>
      </div>

      <div id="daftarBooking" class="booking-grid"></div>

      <p id="bookingKosong" hidden>
        Tidak ada booking yang sesuai dengan filter.
      </p>
    </section>
    <script src="kalender-ketersediaan.js"></script>
  </body>
</html>
