
<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />

  <link rel="stylesheet" href="detail-update-area.css" />
  <title>Detail / Update Area - Saung Hibar</title>
</head>

<body>
  <div class="page">

    <!-- NAVBAR: SAMA DENGAN KELOLA AREA -->
    <header class="header">
      <a class="brand" href="../Kelola%20Area%20Camp/kelola-area.html"
         aria-label="Saung Hibar">
        <span class="brand-symbol">
          <img src="assets/logo.png" alt="Logo Saung Hibar" />
        </span>
      </a>

      <div class="header-actions">
        <button class="header-icon" type="button"
                aria-label="Notifikasi">
          🔔
        </button>

        <div class="menu-wrapper">
          <button
            class="header-icon"
            type="button"
            id="menuButton"
            aria-label="Buka menu"
            aria-expanded="false"
            aria-controls="navigationMenu"
          >
            ☰
          </button>

          <nav id="navigationMenu" class="navigation-menu hidden">
            <a class="nav-item"
               href="../Kelola%20Area%20Camp/kelola-area.html">
              Kelola Area Camping
            </a>

            <a class="nav-item" href="detail-update-area.html">
              Detail / Update Area
            </a>

            <a class="nav-item"
               href="../Kelola%20Area%20Camp/tambah-area.html">
              Tambah Area
            </a>
          </nav>
        </div>
      </div>
    </header>

    <!-- KONTEN -->
    <main class="content">

      <div class="page-heading">
        <a class="back-button"
           href="../Kelola%20Area%20Camp/kelola-area.html"
           aria-label="Kembali">‹</a>

        <div>
          <h1>Detail / Update Area</h1>
        </div>
      </div>

      <!-- FOTO AREA -->
      <div class="photo-wrapper">
        <img
          id="areaImage"
          src="assets/area-camping.jpg"
          alt="Foto area camping Saung Hibar"
        />
      </div>

      <!-- FORM -->
      <form id="detailForm" class="detail-form">

        <div class="form-group">
          <label for="areaName">Nama Area <span>*</span></label>
          <input id="areaName" name="areaName"
                 type="text" value="Camping" required />
        </div>

        <div class="form-group">
          <label for="areaBlock">Nama Blok <span>*</span></label>
          <input id="areaBlock" name="areaBlock"
                 type="text" value="A1" required />
        </div>

        <div class="form-group">
          <label for="areaCapacity">
            Kapasitas Maksimal <span>*</span>
          </label>
          <input id="areaCapacity" name="areaCapacity"
                 type="number" value="4" min="1"
                 max="1000" required />
        </div>

        <div class="form-group">
          <label for="areaStatus">Status <span>*</span></label>
          <div class="select-wrapper">
            <select id="areaStatus" name="areaStatus" required>
              <option value="available">Tersedia</option>
              <option value="unavailable">Tidak Tersedia</option>
            </select>
          </div>
        </div>

        <div class="form-group facilities-group">
          <label>Fasilitas <span>*</span></label>

          <div class="facilities">
            <label class="facility-option">
              <input type="checkbox" name="facility"
                     value="Listrik" checked />
              <span>Listrik</span>
            </label>

            <label class="facility-option">
              <input type="checkbox" name="facility"
                     value="Air Bersih" checked />
              <span>Air Bersih</span>
            </label>

            <label class="facility-option">
              <input type="checkbox" name="facility"
                     value="Wi-Fi" checked />
              <span>Wi-Fi</span>
            </label>
          </div>
        </div>

        <div class="form-group description-group">
          <label for="areaDescription">Catatan / Deskripsi</label>
          <textarea
            id="areaDescription"
            name="areaDescription"
            rows="4"
            placeholder="Contoh: ukuran S, warna biru"
          ></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-save">Simpan</button>
          <button type="button" id="resetButton"
                  class="btn-cancel">Batal</button>
        </div>

      </form>

      <div id="toast" class="toast hidden"
           role="status" aria-live="polite"></div>
    </main>
  </div>

  <script src="navbar.js"></script>
  <script src="detail-update-area.js"></script>
</body>
</html>
