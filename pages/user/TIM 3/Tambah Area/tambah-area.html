<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="tambah-area.css" />
    <title>Tambah Area - Saung Hibar</title>
  </head>

  <body>
    <div class="page">
      <!-- NAVBAR SAMA DENGAN KELOLA AREA -->
      <header class="header">
        <a
          class="brand"
          href="../Kelola%20Area%20Camping/kelola-area.html"
          aria-label="Saung Hibar"
        >
          <span class="brand-symbol">
            <img src="assets/logo.png" alt="Logo Saung Hibar" />
          </span>
        </a>

        <div class="header-actions">
          <button class="header-icon" type="button" aria-label="Notifikasi">
            🔔
          </button>

          <div class="menu-wrapper">
            <button
              class="header-icon"
              type="button"
              id="menuButton"
              aria-label="Buka menu"
              aria-expanded="false"
              aria-controls="navigationMenu"
            >
              ☰
            </button>

            <nav id="navigationMenu" class="navigation-menu hidden">
              <a
                class="nav-item"
                href="../Kelola%20Area%20Camping/kelola-area.html"
              >
                Kelola Area Camping
              </a>

              <a
                class="nav-item"
                href="../Detail%20%26%20Update%20Area/detail-update-area.html"
              >
                Detail / Update Area
              </a>

              <a class="nav-item" href="tambah-area.html"> Tambah Area </a>
            </nav>
          </div>
        </div>
      </header>

      <!-- KONTEN -->
      <main class="content">
        <div class="page-heading">
          <a
            class="back-button"
            href="../Kelola%20Area%20Camping/kelola-area.html"
            aria-label="Kembali ke Kelola Area"
            >‹</a
          >

          <h1>Tambah Area</h1>
        </div>

        <!-- UPLOAD FOTO -->
        <label for="areaPhoto" class="photo-upload" id="photoUpload">
          <input
            type="file"
            id="areaPhoto"
            name="areaPhoto"
            accept="image/*"
            hidden
          />

          <img id="photoPreview" alt="Pratinjau foto area" />

          <span class="upload-placeholder" id="uploadPlaceholder">
            <span class="plus-icon">+</span>
            <span>Tambah Foto Area</span>
          </span>
        </label>

        <!-- FORM TAMBAH AREA -->
        <form id="addAreaForm" class="detail-form">
          <div class="form-group">
            <label for="areaName">Nama Area <span>*</span></label>
            <input
              id="areaName"
              name="areaName"
              type="text"
              placeholder="Contoh: C01"
              required
            />
          </div>

          <div class="form-group">
            <label for="areaBlock">Nama Blok <span>*</span></label>
            <select id="areaBlock" name="areaBlock" required>
              <option value="" selected disabled>Pilih Kategori</option>
              <option value="A1">A1</option>
              <option value="A2">A2</option>
              <option value="B1">B1</option>
              <option value="B2">B2</option>
            </select>
          </div>

          <div class="form-group">
            <label for="areaCapacity">
              Kapasitas Maksimal <span>*</span>
            </label>
            <input
              id="areaCapacity"
              name="areaCapacity"
              type="number"
              min="1"
              max="1000"
              placeholder="Jumlah Orang"
              required
            />
          </div>

          <div class="form-group">
            <label for="areaStatus">Status <span>*</span></label>
            <div class="select-wrapper">
              <select id="areaStatus" name="areaStatus" required>
                <option value="" selected disabled>
                  Tersedia / Tidak Tersedia
                </option>
                <option value="available">Tersedia</option>
                <option value="unavailable">Tidak Tersedia</option>
              </select>
            </div>
          </div>

          <div class="form-group facilities-group">
            <label>Fasilitas <span>*</span></label>

            <div class="facilities">
              <label class="facility-option">
                <input type="checkbox" name="facility" value="Listrik" />
                <span>Listrik</span>
              </label>

              <label class="facility-option">
                <input type="checkbox" name="facility" value="Air Bersih" />
                <span>Air Bersih</span>
              </label>

              <label class="facility-option">
                <input type="checkbox" name="facility" value="Wi-Fi" />
                <span>Wi-Fi</span>
              </label>
            </div>
          </div>

          <div class="form-group description-group">
            <label for="areaDescription">Catatan / Deskripsi</label>
            <textarea
              id="areaDescription"
              name="areaDescription"
              rows="4"
              placeholder="Contoh: ukuran S, warna biru"
            ></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-save">Simpan</button>
            <button type="button" id="resetButton" class="btn-cancel">
              Batal
            </button>
          </div>
        </form>

        <div
          id="toast"
          class="toast hidden"
          role="status"
          aria-live="polite"
        ></div>
      </main>
    </div>

    <script src="../Kelola%20Area%20Camping/navbar.js"></script>
    <script src="tambah-area.js"></script>
  </body>
</html>
